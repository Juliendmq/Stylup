# Déploie la fonction serveur « render » sur Supabase à chaque modification du dossier supabase/.
# Secrets GitHub à créer (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN  jeton personnel Supabase (Account → Access Tokens)
#   SUPABASE_PROJECT_REF   identifiant du projet (l'xxxx de https://xxxx.supabase.co)
name: Supabase function
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets présents ?
        id: check
        run: if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$PROJECT_REF" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Secrets Supabase absents : déploiement ignoré."; fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == '1'
        with:
          version: latest
      - name: Déployer la fonction render
        if: steps.check.outputs.ok == '1'
        run: supabase functions deploy render --project-ref "$PROJECT_REF" --no-verify-jwt
